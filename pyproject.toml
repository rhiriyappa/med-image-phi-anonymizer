[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phi-anonymizer"
version = "1.0.0"
description = "Generative PHI anonymization and watermarking for medical imaging"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.8.0",
    "diffusers>=0.35.2",
    "transformers>=4.57.1",
    "accelerate>=1.11.0",
    "easyocr>=1.7.2",
    "pydicom>=3.0.1",
    "opencv-python>=4.12.0",
    "numpy>=2.2.6",
    "Pillow>=11.3.0",
    "invisible-watermark>=0.2.0",
]

[project.scripts]
phi-anonymize = "phi_anonymizer2:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
